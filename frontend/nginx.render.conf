server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React application routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # FastAPI reverse proxy through the backend's HTTPS endpoint
    location /api/v1/ {
        proxy_pass https://businesspilot-ai-backend-qdv6.onrender.com/api/v1/;

        proxy_http_version 1.1;

        proxy_set_header Host businesspilot-ai-backend-qdv6.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Enable HTTPS upstream SNI
        proxy_ssl_server_name on;
        proxy_ssl_name businesspilot-ai-backend-qdv6.onrender.com;

        # Support AI streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
