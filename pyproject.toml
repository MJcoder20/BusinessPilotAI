[project]
name = "businesspilot-ai"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []


[tool.pytest.ini_options]
testpaths = ["backend"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra"
markers = [
    "llm: tests that call a live language model and may require API credentials or incur costs",
]
